<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Price Entry</title><link rel="stylesheet" href="style.css"></head>
<body><header><div><h1>Product Price Entry</h1><p>Manage products, prices and custom fields</p></div><div class="actions"><button id="addColumnBtn">＋ Add Column</button><button id="addProductBtn" class="primary">＋ Add Product</button><button id="saveBtn" class="save">Save All</button></div></header>
<main><section class="summary"><div><span>Products</span><strong id="productCount">0</strong></div><div><span>Columns</span><strong id="columnCount">0</strong></div><div><span>Total Stock Value</span><strong id="stockValue">0.00</strong></div></section>
<section class="table-card"><div class="toolbar"><input id="search" type="search" placeholder="Search products..."><button id="deleteSelected" class="danger">Delete Selected</button></div><div class="table-wrap"><table id="productTable"><thead></thead><tbody></tbody></table></div></section></main>
<dialog id="columnDialog"><form id="columnForm"><h2>Add New Column</h2><input id="columnName" required maxlength="60" placeholder="e.g. Brand"><div class="dialog-actions"><button type="button" id="cancelCol">Cancel</button><button class="primary">Add Column</button></div></form></dialog><div id="toast"></div><script src="app.js"></script></body></html>
